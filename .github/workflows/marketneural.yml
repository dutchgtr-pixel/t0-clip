name: MarketNeural research

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Test temporal contracts, survival estimators and preserved reference
        run: python -m pytest -q
      - name: Screen public research additions
        run: |
          python scripts/audit_public_release.py --base dc41f873b82ab5c1ac07862c7610bcf2d6a40e62
          python scripts/audit_public_release.py --all-public-text --include-reviewed-documents
      - name: Exercise complete benchmark
        run: |
          python -m marketneural synthetic --output data/synthetic --n 600
          python -m marketneural benchmark --config configs/synthetic_smoke.json --output results/ci_smoke
      - name: Exercise three-stage training and routing
        run: python -m research.cascade --smoke
      - name: Execute isolated feature-store contracts
        run: |
          npm install --prefix results/sql-smoke --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          NODE_PATH="$PWD/results/sql-smoke/node_modules" node research/feature_store_ddl/smoke_pglite.cjs
